name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64, tier: avx2 }
          - { os: ubuntu-24.04-arm, arch: arm64, tier: neon }
    runs-on: ${{ matrix.os }}
    env:
      GF65536_WANT_TIER: ${{ matrix.tier }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: go vet ./...
      - run: go test -v -count=1 ./...
      # Fuzz targets run over their seed corpus (no -fuzz, no flake); randomized
      # fuzzing runs nightly in fuzz.yml.
      - run: go test -count=1 -run '^Fuzz' ./...
      - name: generated assembly is up to date
        run: |
          (cd gen/amd64 && go run .)
          (cd gen/amd64avx2 && go run .)
          (cd gen/arm64 && go run .)
          (cd gen/loong64 && go run .)
          (cd gen/ppc64le && go run .)
          (cd gen/riscv64 && go run .)
          (cd gen/s390x && go run .)
          git diff --exit-code -- '*.s'

  # SSSE3 tier on the amd64 runner too (the best tier above is AVX2; this run
  # pins the fallback by hiding AVX2 from x/sys/cpu).
  ssse3:
    runs-on: ubuntu-latest
    env:
      GODEBUG: cpu.avx2=off
      GF65536_WANT_TIER: ssse3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: go test -v -count=1 ./...

  os-matrix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: go vet ./...
      - run: go test -count=1 ./...

  # The riscv64 RVV, loong64 LSX, ppc64le VSX and s390x vector kernels run under
  # QEMU user emulation with the SIMD feature enabled (models as in
  # go-erasure/reedsolomon's CI); the ppc64le binary also runs as POWER8 to
  # catch an ISA-3.0 instruction.
  emulated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: riscv64, image: "debian:trixie",                 qemu: "rv64,v=true,vlen=256", tier: rvv }
          - { arch: loong64, image: "ghcr.io/loong64/debian:trixie", qemu: "la464",                tier: lsx }
          - { arch: ppc64le, image: "debian:trixie",                 qemu: "power9",               tier: vsx }
          - { arch: ppc64le, image: "debian:trixie",                 qemu: "power8",               tier: vsx }
          - { arch: s390x,   image: "debian:trixie",                 qemu: "qemu",                 tier: vx }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: docker run --privileged --rm tonistiigi/binfmt --install all
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go test -c -o /tmp/t.test .
      - run: docker run --rm --platform linux/${{ matrix.arch }} -e QEMU_CPU=${{ matrix.qemu }} -e GF65536_WANT_TIER=${{ matrix.tier }} -v /tmp:/t ${{ matrix.image }} /t/t.test -test.v

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: GOOS=linux GOARCH=386 go vet ./... && GOOS=linux GOARCH=386 go test -count=1 ./...
      - run: GOOS=linux GOARCH=arm go vet ./... && GOOS=js GOARCH=wasm go vet ./... && GOOS=darwin GOARCH=amd64 go vet ./...
