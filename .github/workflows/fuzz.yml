name: fuzz
# Nightly time-boxed randomized fuzzing; the deterministic seed-corpus run is in
# ci.yml. Steps are continue-on-error so the benign -fuzztime deadline flake never
# reds this workflow; a real crasher is uploaded as an artifact (commit it under
# testdata/fuzz to make it a permanent regression case).
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - run: go test -run '^$' -fuzz '^FuzzMul$' -fuzztime 3m ./...
        continue-on-error: true
      - name: upload any fuzz-discovered corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings-${{ matrix.arch }}
          path: testdata/fuzz/
          if-no-files-found: ignore
